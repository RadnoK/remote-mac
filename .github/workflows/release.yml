name: Release

# Tags vX.Y.Z only — secrets are never available to PRs from forks.
# A tag with a suffix (v1.2.0-beta.1) is a prerelease: GitHub prerelease,
# remote-mac@beta cask, and no appcast — Sparkle only ever offers stable.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    # macos-26 ships Xcode 26.6 (Swift 6.3); macos-15 defaults to Swift 6.1,
    # which cannot read this package's swift-tools-version: 6.2.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Determine version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version matches Info.plist
        run: |
          PLIST_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$PLIST_VER" != "${{ steps.ver.outputs.version }}" ]]; then
            echo "::error::Tag ${{ steps.ver.outputs.version }} != Info.plist $PLIST_VER"
            exit 1
          fi

      # Only the logic target. RemoteMacTests exercises AppKit
      # (NSApplication.shared, NSWindow, NSMenu), which parks the process in
      # CFRunLoopRun on a headless runner — the suites pass individually and
      # then the process never exits. Those tests still run locally, where
      # there is a window server.
      - name: Tests
        run: swift test --filter RemoteMacCoreTests

      # The certificate lands in a temporary keychain, deleted after the job.
      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          echo -n "$P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          # Without this, codesign hangs on a key-access prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$CERT_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 \
            | awk '{print $2}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::Developer ID identity not found in the keychain"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sparkle tools
        run: |
          curl -sL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"

      - name: notarytool profile
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials remotemac-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD"

      - name: Build, notarization, appcast
        env:
          # EdDSA private key read by generate_appcast from the environment
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./Scripts/release.sh "${{ steps.ver.outputs.version }}"

      # Idempotent — on a re-run the release already exists
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: dist/RemoteMac-${{ steps.ver.outputs.version }}.zip
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release already exists — replacing the artifact"
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            FLAGS=()
            [[ "${{ steps.ver.outputs.prerelease }}" == "true" ]] && FLAGS+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "RemoteMac ${{ steps.ver.outputs.version }}" \
              --generate-notes "${FLAGS[@]}"
          fi

      - name: Publish appcast to gh-pages
        if: steps.ver.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/ghp" gh-pages
          cp dist/appcast/appcast.xml "$RUNNER_TEMP/ghp/appcast.xml"
          git -C "$RUNNER_TEMP/ghp" add appcast.xml
          if git -C "$RUNNER_TEMP/ghp" diff --cached --quiet; then
            echo "Appcast unchanged"
          else
            git -C "$RUNNER_TEMP/ghp" commit \
              -m "chore: appcast for ${{ steps.ver.outputs.version }}"
            git -C "$RUNNER_TEMP/ghp" push origin gh-pages
          fi

      # A beta updates only remote-mac@beta. A stable release updates both,
      # so the beta channel always points at whichever build is newest.
      - name: Update casks in the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          SHA="$(shasum -a 256 "dist/RemoteMac-$VERSION.zip" | awk '{print $1}')"
          git clone "https://x-access-token:$GH_TOKEN@github.com/RadnoK/homebrew-tap.git" \
            "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"

          BETA=Casks/remote-mac@beta.rb
          if [[ ! -f "$BETA" ]]; then
            sed -e 's|^cask "remote-mac" do|cask "remote-mac@beta" do|' \
              -e 's|^  name "RemoteMac"|  name "RemoteMac Beta"|' \
              Casks/remote-mac.rb \
              | awk '{ print } /^  auto_updates true/ { print ""; print "  conflicts_with cask: \"remote-mac\"" }' \
              > "$BETA"
          fi

          CASKS=("$BETA")
          [[ "$PRERELEASE" == "false" ]] && CASKS+=(Casks/remote-mac.rb)
          for CASK in "${CASKS[@]}"; do
            sed -i '' "s|^  version .*|  version \"$VERSION\"|" "$CASK"
            sed -i '' "s|^  sha256 .*|  sha256 \"$SHA\"|" "$CASK"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          if git diff --cached --quiet; then
            echo "Casks already up to date — nothing to do"
          else
            git commit -m "chore: remote-mac $VERSION"
            git push origin main
          fi

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
